[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ffl-mcp"
version = "0.5.0"
description = "Local-only MCP server for FastFileLink via ffl-python"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "ffl-python==0.1.6",
  "fastmcp>=4,<4.0.4",
  "comtypes>=1.0; sys_platform == 'win32'",
  "mcp-install==0.1.0"
]

[project.scripts]
ffl-mcp = "src.Entrypoint:main"
install = "src.Entrypoint:install"

[tool.hatch.build.targets.wheel]
packages = ["src"]
include = ["src/**/*.py"]

[tool.hatch.build.targets.wheel.force-include]
"install.config.json" = "install.config.json"

[tool.hatch.build.targets.sdist]
include = ["src/**/*.py", "install.config.json"]
