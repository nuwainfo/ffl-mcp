[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ffl-mcp"
version = "0.3.0"
description = "Local-only MCP server for FastFileLink via ffl-python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "ffl-python>=0.1.1",
  "fastmcp>=4,<5",
  "comtypes>=1.0; sys_platform == 'win32'"
]

[project.scripts]
ffl-mcp = "src.entrypoint:main"
install = "install.install:main"

[tool.hatch.build.targets.wheel]
packages = ["src", "install"]
include = ["src/**/*.py", "install/**/*.py"]

[tool.hatch.build.targets.sdist]
include = ["src/**/*.py", "install/**/*.py"]
